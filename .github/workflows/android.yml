name: Build Android app

# Builds a fresh APK whenever the app changes, and publishes it as a GitHub Release
# so it can be downloaded straight onto a phone.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BrushBuddies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrushBuddies-apk
          path: BrushBuddies.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" BrushBuddies.apk \
            --title "Brush Buddies (build ${{ github.run_number }})" \
            --notes "Download BrushBuddies.apk below on your Android phone and open it to install or update." \
            --latest
