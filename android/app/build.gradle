plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.brimbles.brushbuddies'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.brimbles.brushbuddies'
        minSdk 24
        targetSdk 34
        // CI passes the build number so every APK installs as an update over the last one
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.${versionCode}"
    }

    signingConfigs {
        // The signing key is never stored in the repo. CI decodes it from the BB_KEYSTORE_BASE64
        // secret and passes its location and password in through environment variables.
        family {
            def ks = System.getenv('BB_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('BB_KEYSTORE_PASSWORD')
                keyAlias 'brushbuddies'
                keyPassword System.getenv('BB_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the key (e.g. a local build) fall back to the debug key so the build still works.
            signingConfig System.getenv('BB_KEYSTORE_PATH') ? signingConfigs.family : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The app is the same index.html as the web version: copy it in at build time.
tasks.register('copyWeb', Copy) {
    from rootProject.file('../index.html')
    into 'src/main/assets'
}
preBuild.dependsOn copyWeb
