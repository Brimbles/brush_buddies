<title>Brush Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Bundled copies for the offline Android app (missing on the web, where Google Fonts serves them) */
@font-face { font-family: "Lilita Local"; src: url(fonts/LilitaOne.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Nunito Local"; src: url(fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
/* Layout: one-screen bathroom-mirror app. Animal stage inside a progress ring, giant number, giant button, scrolling buddy strip along the bottom. Single bright look by choice; each buddy tints the room. */
:root {
  color-scheme: light;
  --room: #FFE7A3;
  --room-deep: #F7C948;
  --ink: #2A2140;
  --paper: #FFFDF6;
  --go: #FF5D73;
  --go-shadow: #C73A52;
  --display: "Lilita One", "Lilita Local", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Nunito Local", "Segoe UI", system-ui, sans-serif;
  --beat: .52s;
}
body[data-animal="lion"]     { --room:#FFE2A8; --room-deep:#F7B955; --go:#FF6B3D; --go-shadow:#C2451E; }
body[data-animal="penguin"]  { --room:#CFEFFF; --room-deep:#8DD3F5; --go:#2F7FE0; --go-shadow:#1C56A3; }
body[data-animal="frog"]     { --room:#DDF6C4; --room-deep:#A7DE7E; --go:#2EA84A; --go-shadow:#1D7432; }
body[data-animal="elephant"] { --room:#FFDDE6; --room-deep:#F6A8BE; --go:#E0457B; --go-shadow:#A82D59; }
body[data-animal="octopus"]  { --room:#E8DDFF; --room-deep:#BFA6F5; --go:#7B4BE0; --go-shadow:#5430A8; }
body[data-animal="unicorn"]  { --room:#FFE3F3; --room-deep:#FFB3DC; --go:#E05BB5; --go-shadow:#A83A85; }
body[data-animal="dragon"]   { --room:#D4F5EC; --room-deep:#88DCC6; --go:#E8642C; --go-shadow:#AE4519; }
body[data-animal="hobbit"]   { --room:#EAF2CF; --room-deep:#BFD68A; --go:#3F7D3A; --go-shadow:#285626; }
body[data-animal="dino"]     { --room:#FFF0C9; --room-deep:#F5D07A; --go:#4DAA2C; --go-shadow:#33781B; }
body[data-animal="monkey"]   { --room:#FFE8CC; --room-deep:#F2C08A; --go:#B8662E; --go-shadow:#83451A; }
body[data-animal="bunny"]    { --room:#F3E6FF; --room-deep:#D6B8F5; --go:#F06A9C; --go-shadow:#B54470; }
body[data-animal="robot"]    { --room:#DCE8F2; --room-deep:#A7BFD4; --go:#1F9E9A; --go-shadow:#14706D; }
body[data-animal="karl"]     { --room:#E9E4DE; --room-deep:#BFB3A6; --go:#5B5048; --go-shadow:#3A332D; }
body[data-animal="bjork"]    { --room:#FFE9D2; --room-deep:#F2C38F; --go:#D9853B; --go-shadow:#A35F22; }
body[data-animal="mermaid"]  { --room:#CFF3EF; --room-deep:#7FDAD0; --go:#5B4BC4; --go-shadow:#3D3090; }
body[data-animal="shark"]    { --room:#D5E6F7; --room-deep:#96BDE3; --go:#2C6FB0; --go-shadow:#1C4C7D; }
body[data-animal="fairy"]    { --room:#FCE4F4; --room-deep:#F1B3DD; --go:#B451C9; --go-shadow:#7F3292; }

html, body { height: 100%; }
body {
  background: var(--room); color: var(--ink); font-family: var(--body);
  transition: background .5s ease; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  gap: 10px; padding-block: 14px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; max-width: 520px; margin: 0 auto;
}
header { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .5px; }
.song { font-weight: 800; font-size: .85rem; opacity: .75; }
.mute {
  font: 800 .85rem var(--body); color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  padding: 6px 12px; cursor: pointer;
}

.stage-wrap { position: relative; width: min(72vw, 38vh, 330px); aspect-ratio: 1; max-width: 100%; flex: none; margin-top: 18px; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: var(--paper); stroke: var(--room-deep); stroke-width: 9; }
.ring .bar { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; }
.stage { position: absolute; inset: 9%; }
.stage svg { width: 100%; height: 100%; overflow: visible; display: block; }

.say {
  position: absolute; left: 50%; top: -20px; z-index: 3;
  transform: translateX(-50%) scale(.4); opacity: 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
  padding: 6px 14px; font-family: var(--display); font-size: 1.25rem; white-space: nowrap;
  transition: opacity .2s, transform .3s cubic-bezier(.3,1.7,.5,1); pointer-events: none;
}
.say::after {
  content: ""; position: absolute; left: 50%; bottom: -11px; width: 16px; height: 16px;
  background: var(--paper); border: 3px solid var(--ink); border-top: 0; border-left: 0;
  transform: translateX(-50%) rotate(45deg);
}
.say.show { opacity: 1; transform: translateX(-50%) scale(1); }

.count {
  font-family: var(--display); font-size: clamp(3.6rem, 13vh, 6.5rem); line-height: .9;
  font-variant-numeric: tabular-nums; text-align: center;
}
.count small { display: block; font-family: var(--body); font-weight: 800; font-size: .95rem; letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; margin-top: 4px; }

.go {
  width: 100%; min-height: 88px; border: 0; border-radius: 28px; cursor: pointer;
  font-family: var(--display); font-size: 2.6rem; letter-spacing: 1px; color: #fff;
  background: var(--go); box-shadow: 0 8px 0 var(--go-shadow);
  transition: transform .08s, box-shadow .08s, background .3s;
  text-shadow: 0 3px 0 rgba(0,0,0,.18); flex: none;
}
.go:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--go-shadow); }
.go.stop { background: var(--ink); box-shadow: 0 8px 0 #000; font-size: 2rem; }
.go:focus-visible, .chip:focus-visible, .mute:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.picker {
  width: 100%; min-width: 0; display: flex; gap: 8px; overflow-x: auto; flex: none;
  scroll-snap-type: x proximity; padding: 6px 2px 6px; scrollbar-width: none;
}
.picker::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 70px; scroll-snap-align: start;
  background: var(--paper); border: 3px solid transparent; border-radius: 18px;
  padding: 6px 2px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px;
  font: 800 .72rem var(--body); color: var(--ink); transition: transform .15s, border-color .15s;
}
.chip svg { width: 52px; height: 52px; overflow: visible; }
.chip[aria-pressed="true"] { border-color: var(--ink); transform: translateY(-3px); }
.chip * { animation: none !important; }
.swipe { font-size: .75rem; font-weight: 800; opacity: .6; margin-top: -6px; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- dancing ---------- */
.animal, .animal * { transform-box: fill-box; }
.animal { transform-origin: 50% 100%; }
.stage:not(.dancing) .animal { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }

.dancing .lion { animation: stomp var(--beat) ease-in-out infinite; }
@keyframes stomp { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14%) rotate(6deg); } }
.dancing .lion .mane { transform-origin: 50% 50%; animation: spin calc(var(--beat) * 8) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dancing .penguin { animation: waddle calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes waddle { 0%,100% { transform: rotate(-12deg) translateX(-6%); } 50% { transform: rotate(12deg) translateX(6%); } }
.dancing .penguin .fl-l, .dancing .shark .fl-l { transform-origin: 80% 0%; animation: flapL var(--beat) ease-in-out infinite; }
.dancing .penguin .fl-r, .dancing .shark .fl-r { transform-origin: 20% 0%; animation: flapR var(--beat) ease-in-out infinite; }
@keyframes flapL { 50% { transform: rotate(40deg); } }
@keyframes flapR { 50% { transform: rotate(-40deg); } }

.dancing .frog, .dancing .bunny { animation: hop var(--beat) cubic-bezier(.3,0,.4,1) infinite; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1.1, .88); } 45% { transform: translateY(-22%) scale(.94, 1.08); } }
.dancing .frog .pupil { animation: look calc(var(--beat) * 4) steps(1) infinite; }
@keyframes look { 0% { transform: translateX(-30%); } 50% { transform: translateX(30%); } }

.dancing .elephant, .dancing .dragon { animation: sway calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.dancing .elephant .ear-l, .dancing .animal .wing-l { transform-origin: 100% 50%; animation: earL var(--beat) ease-in-out infinite; }
.dancing .elephant .ear-r, .dancing .animal .wing-r { transform-origin: 0% 50%; animation: earR var(--beat) ease-in-out infinite; }
@keyframes earL { 50% { transform: scaleX(.7) rotate(-8deg); } }
@keyframes earR { 50% { transform: scaleX(.7) rotate(8deg); } }
.dancing .elephant .trunk { transform-origin: 30% 0%; animation: trunk calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes trunk { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-28deg); } }

.dancing .octopus { animation: float calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12%) rotate(5deg); } }
.dancing .octopus .tent { transform-origin: 50% 0%; animation: wig var(--beat) ease-in-out infinite; }
.dancing .octopus .tent:nth-child(even) { animation-direction: reverse; }
@keyframes wig { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }

.dancing .unicorn { animation: gallop var(--beat) ease-in-out infinite; }
@keyframes gallop { 0%,100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-12%); } }
.dancing .unicorn .horn { animation: glow var(--beat) ease-in-out infinite; }
@keyframes glow { 50% { filter: brightness(1.35) drop-shadow(0 0 6px #FFE27A); } }

.dancing .hobbit { animation: jig var(--beat) ease-in-out infinite; }
@keyframes jig { 0%,100% { transform: translateY(0) rotate(-5deg); } 25%,75% { transform: translateY(-9%) rotate(0); } 50% { transform: translateY(0) rotate(5deg); } }
.dancing .hobbit .foot-l { transform-origin: 90% 100%; animation: tap var(--beat) ease-in-out infinite; }
.dancing .hobbit .foot-r { transform-origin: 10% 100%; animation: tap var(--beat) ease-in-out infinite reverse; }
@keyframes tap { 50% { transform: rotate(-18deg); } }

.dancing .dino { animation: stomp2 calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes stomp2 { 0%,100% { transform: rotate(-5deg); } 25%,75% { transform: translateY(-7%); } 50% { transform: rotate(5deg); } }
.dancing .dino .arm-l, .stage.t-clap .dino .arm-l { transform-origin: 100% 0%; animation: flapR calc(var(--beat) / 2) ease-in-out infinite; }
.dancing .dino .arm-r, .stage.t-clap .dino .arm-r { transform-origin: 0% 0%; animation: flapL calc(var(--beat) / 2) ease-in-out infinite; }
.stage.t-clap .dino .arm-l, .stage.t-clap .dino .arm-r { animation-duration: .14s; }

.dancing .monkey { animation: monk calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes monk { 0%,100% { transform: translateX(-9%); } 25%,75% { transform: translateY(-12%); } 50% { transform: translateX(9%); } }

.dancing .bunny .ear-l { transform-origin: 50% 100%; animation: earwig var(--beat) ease-in-out infinite; }
.dancing .bunny .ear-r { transform-origin: 50% 100%; animation: earwig var(--beat) ease-in-out infinite reverse; }
@keyframes earwig { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } }

.dancing .robot { animation: robo calc(var(--beat) * 2) steps(1) infinite; }
@keyframes robo { 0% { transform: rotate(-7deg); } 25%,75% { transform: translateY(-6%); } 50% { transform: rotate(7deg); } }
.dancing .robot .light { animation: blink var(--beat) steps(1) infinite; }
.stage.t-beep .robot .light { animation: blink .16s steps(1) infinite; }
@keyframes blink { 50% { opacity: .2; } }

.dancing .karl { animation: jig var(--beat) ease-in-out infinite; }
.dancing .bjork { animation: jig var(--beat) ease-in-out infinite; }
@keyframes grump { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-4%); } }
.dancing .mermaid, .dancing .fairy { animation: float calc(var(--beat) * 2) ease-in-out infinite; }
.dancing .shark { animation: sway calc(var(--beat) * 2) ease-in-out infinite; }

/* tricks take over from the dance */
.stage.trick .animal, .stage.trick .animal .mane, .stage.trick .animal .tent, .stage.trick .animal .pupil,
.stage.trick .animal .fl-l, .stage.trick .animal .fl-r, .stage.trick .animal .ear-l, .stage.trick .animal .ear-r,
.stage.trick .animal .trunk, .stage.trick .animal .foot-l, .stage.trick .animal .foot-r { animation: none; }
.stage.t-flyup .animal .wing-l { transform-origin: 100% 50%; animation: earL .18s ease-in-out infinite; }
.stage.t-flyup .animal .wing-r { transform-origin: 0% 50%; animation: earR .18s ease-in-out infinite; }
.elephant .trunk { transform-origin: 30% 0%; transition: transform .35s ease; }
.stage.t-spray .elephant .trunk { transform: rotate(-125deg); }

@media (prefers-reduced-motion: reduce) {
  .animal, .animal * { animation-duration: calc(var(--beat) * 4) !important; }
  .confetti { display: none; }
}
@media (max-height: 640px) {
  .go { min-height: 70px; font-size: 2rem; }
  h1 { font-size: 1.3rem; }
  .swipe { display: none; }
}
</style>

<div class="app">
  <header>
    <div>
      <h1>Brush Buddies</h1>
      <div class="song" id="song">Jungle Stomp</div>
    </div>
    <button class="mute" id="mute" aria-pressed="false">Sound on</button>
  </header>

  <div class="stage-wrap">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="45"></circle>
      <circle class="bar" id="bar" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
    </svg>
    <div class="stage" id="stage"></div>
    <div class="say" id="say" aria-live="polite"></div>
  </div>

  <div class="count" id="count">30<small>seconds</small></div>

  <button class="go" id="go">Start!</button>

  <div class="picker" id="picker" role="group" aria-label="Choose your buddy"></div>
  <div class="swipe">Swipe for more buddies</div>
</div>

<div class="confetti" id="confetti"></div>

<script>
/* ======================================================================
   BUDDIES — drawn in a 200×200 box, feet near y=184
   ====================================================================== */
const D = '#2A2140', PINK = '#FF8FA3';
const cheeks = (y, l = 70, r = 130, rr = 8) => `<circle cx="${l}" cy="${y}" r="${rr}" fill="${PINK}" opacity=".55"/><circle cx="${r}" cy="${y}" r="${rr}" fill="${PINK}" opacity=".55"/>`;
const eyes = (y, l = 80, r = 120, rr = 7) => `<circle cx="${l}" cy="${y}" r="${rr}" fill="${D}"/><circle cx="${r}" cy="${y}" r="${rr}" fill="${D}"/><circle cx="${l + 2}" cy="${y - 3}" r="2.3" fill="#fff"/><circle cx="${r + 2}" cy="${y - 3}" r="2.3" fill="#fff"/>`;

const ANIMALS = {
  lion: { name: 'Lion', song: 'Jungle Stomp', mouth: [100, 138], roar: 'ROAR!', tricks: ['roar', 'backflip', 'spin'], svg: `
    <g class="animal lion">
      <circle class="mane" cx="100" cy="102" r="74" fill="#E8762B" stroke="#E8762B" stroke-width="16" stroke-dasharray="16 9" stroke-linecap="round"/>
      <circle cx="56" cy="56" r="17" fill="#F5B53D"/><circle cx="56" cy="56" r="8" fill="#E8762B"/>
      <circle cx="144" cy="56" r="17" fill="#F5B53D"/><circle cx="144" cy="56" r="8" fill="#E8762B"/>
      <circle cx="100" cy="108" r="56" fill="#F5B53D"/>
      ${cheeks(122, 68, 132, 9)}${eyes(98)}
      <ellipse cx="100" cy="132" rx="27" ry="19" fill="#FCE6B0"/>
      <path d="M89 120 h22 l-11 11 z" fill="#6B3B22" stroke="#6B3B22" stroke-width="3" stroke-linejoin="round"/>
      <path d="M100 131 v6 M87 139 q13 11 26 0" stroke="#6B3B22" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>` },
  penguin: { name: 'Penguin', song: 'Ice Slide', mouth: [100, 96], tricks: ['fish', 'slide'], svg: `
    <g class="animal penguin">
      <ellipse cx="78" cy="184" rx="17" ry="7" fill="#F59E2B"/><ellipse cx="122" cy="184" rx="17" ry="7" fill="#F59E2B"/>
      <path class="fl-l" d="M52 100 q-26 32 -12 66 q16 -10 20 -46 z" fill="#1E2A3A"/>
      <path class="fl-r" d="M148 100 q26 32 12 66 q-16 -10 -20 -46 z" fill="#1E2A3A"/>
      <ellipse cx="100" cy="112" rx="54" ry="72" fill="#1E2A3A"/>
      <ellipse cx="100" cy="128" rx="38" ry="54" fill="#F4F7FA"/>
      <circle cx="84" cy="78" r="20" fill="#F4F7FA"/><circle cx="116" cy="78" r="20" fill="#F4F7FA"/>
      ${eyes(78, 86, 114, 6.5)}${cheeks(94, 72, 128, 7)}
      <path d="M89 91 q11 16 22 0 z" fill="#F59E2B" stroke="#F59E2B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 112 l22 8 l22 -8 l-4 14 l-18 -6 l-18 6 z" fill="#FF5D73"/>
    </g>` },
  frog: { name: 'Frog', song: 'Lily Pad Hop', mouth: [100, 116], tricks: ['backflip', 'fly'], svg: `
    <g class="animal frog">
      <ellipse cx="52" cy="176" rx="28" ry="12" fill="#4E9A33"/><ellipse cx="148" cy="176" rx="28" ry="12" fill="#4E9A33"/>
      <ellipse cx="100" cy="142" rx="58" ry="42" fill="#6CC24A"/>
      <ellipse cx="100" cy="152" rx="34" ry="26" fill="#C9EBA0"/>
      <circle cx="64" cy="62" r="23" fill="#6CC24A"/><circle cx="136" cy="62" r="23" fill="#6CC24A"/>
      <ellipse cx="100" cy="100" rx="70" ry="44" fill="#6CC24A"/>
      <circle cx="64" cy="60" r="15" fill="#fff"/><circle cx="136" cy="60" r="15" fill="#fff"/>
      <circle class="pupil" cx="64" cy="62" r="8" fill="${D}"/><circle class="pupil" cx="136" cy="62" r="8" fill="${D}"/>
      <circle cx="93" cy="88" r="2.5" fill="#2D5A1E"/><circle cx="107" cy="88" r="2.5" fill="#2D5A1E"/>
      ${cheeks(108, 50, 150, 10)}
      <path d="M60 106 q40 32 80 0" stroke="#2D5A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>` },
  elephant: { name: 'Elephant', song: 'Trumpet Parade', mouth: [104, 130], tricks: ['spray', 'spin'], svg: `
    <g class="animal elephant">
      <g class="ear-l"><ellipse cx="46" cy="100" rx="40" ry="50" fill="#9AA9BC"/><ellipse cx="50" cy="100" rx="25" ry="34" fill="#F2B8C6"/></g>
      <g class="ear-r"><ellipse cx="154" cy="100" rx="40" ry="50" fill="#9AA9BC"/><ellipse cx="150" cy="100" rx="25" ry="34" fill="#F2B8C6"/></g>
      <path d="M84 52 L100 12 L116 52 z" fill="#FF5D73"/><circle cx="100" cy="12" r="7" fill="#FFD23F"/>
      <circle cx="100" cy="96" r="52" fill="#B4C1D2"/>
      <path class="trunk" d="M86 120 q-8 40 14 60 q12 8 20 -4 q-6 -4 -10 2 q-14 -14 -8 -58 z" fill="#B4C1D2" stroke="#8E9DB1" stroke-width="3" stroke-linejoin="round"/>
      ${eyes(90)}${cheeks(112, 68, 132)}
      <path d="M80 126 q-4 12 6 16" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M120 126 q4 12 -6 16" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>` },
  octopus: { name: 'Octopus', song: 'Bubble Wobble', mouth: [100, 116], tricks: ['juggle', 'bubbles'], svg: `
    <g class="animal octopus">
      <g stroke="#9B5DE5" stroke-width="16" fill="none" stroke-linecap="round">
        <path class="tent" d="M52 118 q-16 30 4 60"/><path class="tent" d="M72 126 q-8 30 2 62"/>
        <path class="tent" d="M92 130 q-6 30 2 60"/><path class="tent" d="M108 130 q6 30 -2 60"/>
        <path class="tent" d="M128 126 q8 30 -2 62"/><path class="tent" d="M148 118 q16 30 -4 60"/>
      </g>
      <ellipse cx="100" cy="86" rx="60" ry="56" fill="#9B5DE5"/>
      <circle cx="70" cy="50" r="8" fill="#B98CF0"/><circle cx="128" cy="44" r="11" fill="#B98CF0"/><circle cx="104" cy="36" r="5" fill="#B98CF0"/>
      <circle cx="78" cy="90" r="14" fill="#fff"/><circle cx="122" cy="90" r="14" fill="#fff"/>
      ${eyes(92)}${cheeks(110, 62, 138)}
      <path d="M86 114 q14 12 28 0" stroke="${D}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>` },

  jeep: d => { const t = audio().currentTime; noise(t, d * .55, 180, .2, 'lowpass', 400); [.15, .24].forEach(x => { tone(420, t + d * x, .14, { type: 'square', vol: .07 }); tone(330, t + d * x, .14, { type: 'square', vol: .07 }); });
    [.2, .3, .4, .5, .6].forEach(x => tone(140, t + d * x, .22, { vol: .4, to: 42 })); },
  zap: d => { const t = audio().currentTime + d * .36; tone(60, t, d * .26, { type: 'sawtooth', vol: .16 }); for (let i = 0; i < 9; i++) noise(t + i * .1, .05, 5000, .3); tone(500, t + d * .3, .5, { vol: .2, to: 120 }); },
  gulp: d => { const t = audio().currentTime; tone(300, t + d * .3, .3, { vol: .15, to: 900 }); [.5, .58].forEach(x => tone(520, t + d * x, .1, { type: 'square', vol: .1, to: 140 })); tone(95, t + d * .66, .5, { type: 'sawtooth', vol: .2, to: 60, brass: true }); },
  ring: d => { const t = audio().currentTime; tone(1568, t + .1, .6, { type: 'triangle', vol: .1 }); tone(220, t + d * .3, d * .5, { vol: .1, wobble: true }); tone(233, t + d * .3, d * .5, { vol: .1, wobble: true }); noise(t + d * .3, .6, 400, .2, 'bandpass', 3000); tone(300, t + d * .82, .3, { vol: .25, to: 900 }); },
  steps: d => { const t = audio().currentTime; for (let x = .1; x < .9; x += .1) drum('d', t + d * x); },
  fireworks: d => { const t = audio().currentTime; [.1, .32, .54].forEach(x => { tone(500, t + d * x, d * .16, { type: 'sine', vol: .08, to: 2000 }); noise(t + d * (x + .16), .5, 900, .4, 'lowpass', 200); noise(t + d * (x + .2), .6, 6000, .08); }); },
  stretch: d => { const t = audio().currentTime; tone(300, t + d * .02, d * .2, { type: 'sine', vol: .2, to: 900, wobble: true }); tone(900, t + d * .85, d * .1, { type: 'sine', vol: .2, to: 300 }); },
  busstop: d => { const t = audio().currentTime; noise(t, d * .95, 3000, .05); tone(900, t + d * .3, .12, { vol: .2, to: 400 }); tone(70, t + d * .56, .5, { vol: .5, to: 40 }); noise(t + d * .58, 1.2, 2500, .3, 'highpass'); },
  catbus: d => { const t = audio().currentTime; noise(t, d * .95, 3000, .05); tone(48, t + d * .14, d * .7, { type: 'sawtooth', vol: .07, wobble: true, brass: true }); meow(t + d * .37, .55, .3); meow(t + d * .9, 1, .2); },
  peas: d => { const t = audio().currentTime; for (let i = 0; i < 6; i++) tone(700, t + d * (.24 + i * .1), .07, { type: 'square', vol: .08, to: 200 }); },
  headbop: d => { const t = audio().currentTime; [.3, .5].forEach(x => tone(140, t + d * x, .15, { vol: .35, to: 70 })); tone(32, t + d * .55, d * .35, { type: 'sawtooth', vol: .1, wobble: true, brass: true }); },
  fouram: d => { const t = audio().currentTime; [.16, .32, .46].forEach((x, i) => meow(t + d * x, 1 + i * .12, .25)); tone(2200, t + d * .71, .3, { type: 'triangle', vol: .15 }); [.78, .84, .9].forEach(x => tone(520, t + d * x, .08, { type: 'square', vol: .08, to: 160 })); },
  snore: d => { const t = audio().currentTime; [.3, .55, .8].forEach(x => { tone(70, t + d * x, .5, { type: 'sawtooth', vol: .1, to: 55, brass: true }); noise(t + d * x, .5, 400, .12, 'lowpass', 200); }); },
  typing: d => { const t = audio().currentTime + d * .28; for (let i = 0; i < 16; i++) noise(t + i * .09 + Math.random() * .04, .025, 3000, .25, 'bandpass'); },
  door: d => { const t = audio().currentTime; tone(110, t + d * .45, .25, { vol: .5, to: 50 }); noise(t + d * .45, .1, 800, .2, 'lowpass'); tone(300, t + d * .79, .3, { vol: .25, to: 900 }); },
};
function meow(t, pitch = 1, vol = .25) {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1300 * pitch; f.Q.value = 1.5;
  o.frequency.setValueAtTime(480 * pitch, t); o.frequency.linearRampToValueAtTime(820 * pitch, t + .14); o.frequency.linearRampToValueAtTime(520 * pitch, t + .42);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.linearRampToValueAtTime(vol * .8, t + .3); g.gain.linearRampToValueAtTime(0, t + .45);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + .5);
}
function fanfare() {
  const t = audio().currentTime + .05;
  [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * .12, .3, { type: 'square', vol: .08 }));
  [72, 76, 79, 84].forEach(m => tone(mtof(m), t + .5, 1.2, { type: 'triangle', vol: .14 }));
  drum('k', t + .5); noise(t + .5, .6, 5000, .12);
}

/* ======================================================================
   APP
   ====================================================================== */
const TOTAL = 30000, TRICK_AT = [10000, 20000];
const CHEERS = ['Super brushing!', 'Sparkly teeth!', 'You\'re a brushing star!', 'Wow, so shiny!', 'Brilliant job!', 'Keep it up!', 'Teeth twinkling!', 'Brush brush brush!', 'Amazing!'];
const LAST_CHEERS = ['Nearly done!', 'Almost there!', 'Last little bit!', 'So close!'];
const $ = id => document.getElementById(id);
const stage = $('stage'), bar = $('bar'), count = $('count'), go = $('go'), say = $('say');
let current = 'lion', running = false, startAt = 0, raf = 0, wake = null, tricksDone = 0, plan = [], trickTimer = 0;
try { const s = localStorage.getItem('bb-animal'); if (ANIMALS[s]) current = s; } catch (e) {}
try { muted = localStorage.getItem('bb-muted') === '1'; } catch (e) {}

const pick = arr => arr[Math.random() * arr.length | 0];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const chipSvg = k => `<svg viewBox="0 0 200 200" aria-hidden="true">${ANIMALS[k].svg}</svg>`;
const stageSvg = k => `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><clipPath id="clip"><circle cx="100" cy="100" r="98"/></clipPath></defs><g id="back" clip-path="url(#clip)"></g><g transform="translate(100 180)"><g id="pivot"><g transform="translate(-100 -180)">${ANIMALS[k].svg}</g></g></g><g id="front"></g></svg>`;

function choose(k) {
  endTrick();
  current = k;
  document.body.dataset.animal = k;
  stage.innerHTML = stageSvg(k);
  stage.setAttribute('aria-label', ANIMALS[k].name);
  $('song').textContent = ANIMALS[k].song;
  document.documentElement.style.setProperty('--beat', (60 / SONGS[k].bpm) + 's');
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.k === k));
  plan = shuffle(ANIMALS[k].tricks);
  try { localStorage.setItem('bb-animal', k); } catch (e) {}
  if (running) { stopMusic(); startMusic(); }
}
$('picker').innerHTML = Object.keys(ANIMALS).map(k =>
  `<button class="chip" id="chip-${k}" data-k="${k}" aria-pressed="false">${chipSvg(k)}<span>${ANIMALS[k].name}</span></button>`).join('');
$('picker').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) choose(c.dataset.k); });

function showSay(text, ms = 2600) {
  say.textContent = text; say.classList.add('show');
  clearTimeout(showSay.t); showSay.t = setTimeout(() => say.classList.remove('show'), ms);
}

function runTrick(name, msg) {
  endTrick();
  const t = TRICKS[name], d = t.dur, a = ANIMALS[current];
  const { back = '', front = '', pivot = '', carry = '' } = t.build(d, a);
  const svg = stage.querySelector('svg');
  $('back').innerHTML = back; $('front').innerHTML = front;
  $('pivot').insertAdjacentHTML('afterbegin', pivot);
  if (carry) $('pivot').insertAdjacentHTML('beforeend', `<g class="carry" transform="translate(-100 -180)">${carry}</g>`);
  stage.classList.add('trick', 't-' + name);
  // a freshly drawn buddy needs its SVG clock running before animations can start
  const begin = () => svg.querySelectorAll('animate, animateTransform, animateMotion').forEach(el => { try { el.beginElement(); } catch (e) {} });
  if (svg.getCurrentTime() > 0.05) begin(); else requestAnimationFrame(() => requestAnimationFrame(begin));
  try { SFX[t.sfx]?.(d); } catch (e) {}
  if (msg) showSay(msg, d * 1000);
  trickTimer = setTimeout(endTrick, d * 1000 + 60);
}
function endTrick() {
  clearTimeout(trickTimer);
  const b = $('back'), f = $('front'), p = $('pivot');
  if (b) b.innerHTML = ''; if (f) f.innerHTML = '';
  if (p) p.querySelectorAll(':scope > animate, :scope > animateTransform, :scope > .carry').forEach(el => el.remove());
  [...stage.classList].filter(c => c === 'trick' || c.startsWith('t-')).forEach(c => stage.classList.remove(c));
}

function setCount(sec, label) { count.innerHTML = `${sec}<small>${label}</small>`; }
function tick() {
  const el = performance.now() - startAt, left = Math.max(0, TOTAL - el);
  bar.setAttribute('stroke-dashoffset', (100 * (1 - left / TOTAL)).toFixed(2));
  setCount(Math.ceil(left / 1000), left > 0 ? 'seconds left' : 'done!');
  if (tricksDone < TRICK_AT.length && el >= TRICK_AT[tricksDone]) {
    const name = plan[tricksDone % plan.length];
    runTrick(name, tricksDone === TRICK_AT.length - 1 ? pick(LAST_CHEERS) : pick(CHEERS));
    tricksDone++;
  }
  if (left <= 0) return finish();
  raf = requestAnimationFrame(tick);
}
async function lockScreen() {
  try { window.BrushApp?.keepAwake(true); } catch (e) {}   // inside the Android app
  try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { wake = null; }
}
function release() {
  try { window.BrushApp?.keepAwake(false); } catch (e) {}
  try { wake?.release(); } catch (e) {} wake = null;
}

function start() {
  audio(); running = true; tricksDone = 0; startAt = performance.now();
  plan = shuffle(ANIMALS[current].tricks);
  stage.classList.add('dancing');
  go.textContent = 'Stop'; go.classList.add('stop');
  startMusic(); lockScreen(); tick();
}
function reset() {
  running = false; cancelAnimationFrame(raf); stopMusic(); release(); endTrick();
  stage.classList.remove('dancing');
  go.textContent = 'Start!'; go.classList.remove('stop');
  bar.setAttribute('stroke-dashoffset', '0');
}
function finish() {
  reset();
  setCount('0', 'sparkly clean!');
  go.textContent = 'Again!';
  fanfare(); confetti();
  runTrick('bighop');
  showSay('All done! Sparkly clean!', 3400);
  try { navigator.vibrate?.([120, 60, 120]); } catch (e) {}
}
go.addEventListener('click', () => { if (running) { reset(); setCount(30, 'seconds'); } else start(); });

function confetti() {
  const box = $('confetti'), colors = ['#FF5D73', '#FFD23F', '#2EA84A', '#2F7FE0', '#9B5DE5', '#FF8A3D'];
  box.innerHTML = Array.from({ length: 60 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${colors[Math.random() * 6 | 0]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s"></i>`).join('');
  setTimeout(() => box.innerHTML = '', 3800);
}

const muteBtn = $('mute');
function paintMute() { muteBtn.textContent = muted ? 'Sound off' : 'Sound on'; muteBtn.setAttribute('aria-pressed', muted); }
muteBtn.addEventListener('click', () => {
  muted = !muted; paintMute();
  if (master) master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .02);
  try { localStorage.setItem('bb-muted', muted ? '1' : '0'); } catch (e) {}
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) lockScreen(); });

/* tap the buddy for a bonus trick */
stage.addEventListener('click', () => { if (!stage.classList.contains('trick')) { audio(); runTrick(pick(ANIMALS[current].tricks)); } });

paintMute();
choose(current);
document.getElementById('chip-' + current)?.scrollIntoView({ inline: 'center', block: 'nearest' });
</script>
